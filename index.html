<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Jardín de Tulipanes Animado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="garden">
        <!-- Elementos de fondo y ambiente -->
        <div class="sun"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>
        <div class="cloud cloud-5"></div>
        
        <!-- Mensaje de celebración en el centro -->
        <div class="love-message">
            <h1>Te amo</h1>
            <h2>Felices 4 meses</h2>
        </div>

        <!-- Las flores se generan aquí con JavaScript -->

        <!-- Hierbas bajas frondosas -->
        <div class="grass-field">
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
        </div>

        <!-- Suelo / Piso del jardín -->
        <div class="ground"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
